<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/media.css">
    <title>Omni Dish</title>
</head>

<body>
    <!-- start navbar -->
    <nav class="navbar">
        <div class="logo">
            <a href="#">
                <img src="./images/OmniDish.png" alt="OmniDish" />
                <span>OmniDish</span>
            </a>
        </div>


        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Countries</a></li>
            <li><a href="#">Categories</a></li>
            <li><a href="#">Search</a></li>
            <li><a href="#" class="rr">Random Recipe</a></li>
        </ul>

        <div class="Right">
            <ul>
                <li>
                    <a href="#" class="search-icon">
                        <img src="./images/search-icon.png" alt="Search" />
                    </a>
                </li>
                <li>
                    <a href="#" class="dark-mode-icon">
                        <img src="./images/dark-mode-icon.png" alt="Dark Mode" />
                    </a>
                </li>
            </ul>
        </div>
    </nav>
    <!-- ===== MAIN ===== -->
    <div class="main d-flex align-items-center min-vh-100 text-white object-fit: cover p-5 ">
        <div class="main_title">
            <div class="content">
                <h1 class="fs1 mb-3">Countries & Regions
                </h1>
                <p class="paragraph fs-6  ">Explore the unique flavors of each country. <br>Click on a country to see
                    its traditional recipes.</p>
            </div>

        </div>
    </div>


    <section>
        <div class="Header d-flex py-3 align-items-center ">
            <div class="left me-auto d-flex ms-4 align-items-center">
                <img src="images/ChatGPT Image Oct 14, 2026, 11_55_57 PM.png" alt="Earth" class="Earth me-2">
                <h1 class="text-white fs-4 mb-0">Popular Countries</h1>
            </div>
            <div class="right ms-auto d-flex me-4 align-items-center">
                <h3 class="fs-5 me-2 mb-0">View All</h3>
                <i class="fa-solid fa-arrow-right card-text"></i>
            </div>
        </div>
        <div class="cards d-flex justify-content-center pb-4 flex-wrap gap-3">
            <div class="card col-8 col-sm-4 col-lg-3 border-1">
                <img src="images/Giza Pyramids stock photo_ Image of landmark, geometry - 30444618.jpg"
                    class="card-img-top" alt="Pyramids">
                <div class="card-body d-flex py-3 px-3 flex-wrap">
                    <div class=" head-left d-flex">
                        <img src="https://flagsapi.com/EG/shiny/32.png" alt="Egypt-flag" class="me-1">
                        <p class="card-text text-white">Egypt</p>
                    </div>
                    <div class="head-right ms-auto">
                        <i class="fa-solid fa-arrow-right text-white card-text"></i>
                    </div>
                </div>
            </div>
            <div class="card col-12 col-sm-5 col-lg-3 border-1 ">
                <img src="images/European Rail Vacation Packages with Air.jpg" class="card-img-top" alt="Italy">
                <div class="card-body d-flex py-3 px-3">
                    <div class="head-left d-flex">
                        <img src="https://flagsapi.com/IT/shiny/32.png" alt="Italy-flag" class="me-1">
                        <p class="card-text text-white">Italy</p>
                    </div>
                    <div class="head-right ms-auto">
                        <i class="fa-solid fa-arrow-right text-white card-text"></i>
                    </div>
                </div>
            </div>
            <div class="card col-12 col-sm-5 col-lg-3 border-1">
                <img src="images/Taj Mahal monument - Agra, India.jpg" class="card-img-top" alt="Taj-Mahal">
                <div class="card-body d-flex py-3 px-3">
                    <div class="head-left d-flex">
                        <img src="https://flagsapi.com/IN/shiny/32.png" alt="India-flag" class="me-1">
                        <p class="card-text text-white">India</p>
                    </div>
                    <div class="head-right ms-auto">
                        <i class="fa-solid fa-arrow-right text-white card-text"></i>
                    </div>
                </div>
            </div>
            <div class="card col-12 col-sm-5 col-lg-3 border-1">
                <img src="images/japan.jpg" class="card-img-top" alt="Japan">
                <div class="card-body d-flex py-3 px-3">
                    <div class="head-left d-flex">
                        <img src="https://flagsapi.com/JP/shiny/32.png" alt="Japan-flag" class="me-1">
                        <p class="card-text text-white">Japan</p>
                    </div>

                    <div class="head-right ms-auto">
                        <i class="fa-solid fa-arrow-right text-white card-text"></i>
                    </div>
                </div>
            </div>
            <div class="card col-12 col-sm-5 col-lg-3 border-1">
                <img src="images/best-states-to-make-a-living.jpg" class="card-img-top" alt="State">
                <div class="card-body d-flex py-3 px-3">
                    <div class="head-left d-flex">
                        <img src="https://flagsapi.com/US/shiny/32.png" alt="US-flag" class="me-1">
                        <p class="card-text text-white">USA</p>
                    </div>
                    <div class="head-right ms-auto">
                        <i class="fa-solid fa-arrow-right text-white card-text"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="cards d-flex justify-content-center pb-4 flex-wrap gap-3">
            <div class="card col-12 col-sm-5 col-lg-3 border-1">
                <img src="images/Giza Pyramids stock photo_ Image of landmark, geometry - 30444618.jpg"
                    class="card-img-top" alt="Pyramids">
                <div class="card-body d-flex py-3 px-3">
                    <div class="head-left d-flex">
                        <img src="https://flagsapi.com/EG/shiny/32.png" alt="Egypt-flag" class="me-1">
                        <p class="card-text text-white">Egypt</p>
                    </div>

                </div>
    </section>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
