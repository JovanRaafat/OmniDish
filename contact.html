<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/contact.css" />
  <title>Omni Dish</title>
</head>

<body>
  <div class="main">
    <div class="light">
      <h1 class=" d-flex justify-content-center text-light pt-3">Contact Us</h1>
      <main class="contact d-flex justify-content-center align-items-center">
        <div class="card w-75 rounded-5 p-4 shadow">
          <div class="card-body justify-content-between ">
            <div class="row">
              <div class="col-md-6">
                <h4 class="fs-4 mb-4">Send us a message</h4>
                <div class="mb-3">
                  <div class="mb-3">
                    <label for="name22" class="form-label">Name</label>
                    <input type="text" class="form-control rounded-5" id="name22" placeholder="Name">
                  </div>
                  <label for="exampleFormControlInput1" class="form-label">Email address</label>
                  <input type="email" class="form-control rounded-5" id="exampleFormControlInput1"
                    placeholder="name@example.com">
                </div>
                <div class="mb-3">
                  <label for="password22" class="form-label">Password</label>
                  <input type="password" class="form-control rounded-5" id="password22" placeholder="Password">
                </div>
                <button type="button" class="btn btn-primary px-4 py-2 rounded-pill">Submit</button>
              </div>
              <div class=" col-md-6 d-flex flex-column justify-content-center ps-md-5 ">
                <h3 class="mb-4 ">Get in touch</h3>
                <div class="d-flex flex-column gap-3">
                  <div class="d-flex align-items-center gap-3 mt-2">
                    <i class="fa-solid fa-location-dot text-warning fs-5"></i>
                    <p class="mb-0">Egypt, Cairo</p>
                  </div>
                  <div class="d-flex align-items-center gap-3">
                    <i class="fa-solid fa-envelope text-warning fs-5"></i>
                    <p class="mb-0">example@gmail.com</p>
                  </div>
                  <div class="d-flex align-items-center gap-3">
                    <i class="fa-solid fa-phone text-warning fs-5"></i>
                    <p class="mb-0">+12345678977</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>

</html>
