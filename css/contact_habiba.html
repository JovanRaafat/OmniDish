<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="contact.css" />
    <link rel="stylesheet" href="css/media.css">
    <title>Omni Dish</title>
</head>

<body>
    <div class="main  ">

        <div class="main_title d-flex align-items-center min-vh-100 text-white  justify-content-around ">
            
            <h1 class="content ">Start a <span class="bg-primary rounded-pill fs-2 text-light">Conversation</span>
                <br>We’re All Ears<br>
                <span class="text-primary">Let’s Connect</span>
            </h1>
            <div class="form border-white  bg-body-tertiary">
                <h2 class="text-dark ms-3"> Contact Form </h2>
                <div class="mb-3 ms-3 me-3 text-dark ">
                    <label for="exampleFormControlInput1" class="form-label">First Name </label>
                    <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="First Name">
                    <label for="exampleFormControlInput1" class="form-label">Last Name </label>
                    <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="Last Name">
                    <label for="exampleFormControlInput1" class="form-label">Email </label>
                    <input type="email" class="form-control" id="exampleFormControlInput1"
                        placeholder="name@example.com">
                    <button type="submit" class="btn btn-primary align-items-center w-100 mt-3 ">Submit</button>    
                </div>
            </div>

        </div>
</body>
